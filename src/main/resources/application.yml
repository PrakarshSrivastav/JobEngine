spring:
  application:
    name: jobengine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/jobengine}
    username: ${DB_USERNAME:jobengine}
    password: ${DB_PASSWORD:jobengine}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: ${DB_POOL_SIZE:10}
  docker:
    compose:
      enabled: false
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  task:
    scheduling:
      pool:
        size: 3

jobengine:
  # Blank = hostname plus a random suffix, so every instance gets a distinct id.
  node-id: ${JOBENGINE_NODE_ID:}
  worker:
    enabled: ${JOBENGINE_WORKER_ENABLED:true}
    threads: ${JOBENGINE_WORKER_THREADS:4}
    poll-interval: 500ms
    heartbeat-interval: 5s
    lease-timeout: 30s
    reaper-interval: 10s
  retry:
    base-backoff: 2s
    max-backoff: 5m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: ${PORT:8080}
  shutdown: graceful
