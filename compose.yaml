services:
  postgres:
    image: postgres:16
    container_name: jobengine-postgres
    environment:
      POSTGRES_DB: jobengine
      POSTGRES_USER: jobengine
      POSTGRES_PASSWORD: jobengine
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: jobengine-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: