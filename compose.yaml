services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobengine
      POSTGRES_USER: jobengine
      POSTGRES_PASSWORD: jobengine
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobengine -d jobengine"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
